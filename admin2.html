<!DOCTYPE html>
<html lang="ar" dir="rtl"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="referrer" content="no-referrer">
<title>لوحة تحكم المتجر</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7f4;--card:#fff;--tx:#1b261c;--mu:#607061;--g:#2e7d32;--gl:#e8f5e9;--bd:#dce5dc}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Cairo',Tahoma,sans-serif;padding:16px}
.box{max-width:1000px;margin:auto;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:20px;box-shadow:0 8px 25px rgba(0,0,0,.05);margin-bottom:16px}
h1,h2,h3{margin-top:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--gl);border:1px solid var(--bd);border-radius:16px;padding:14px;text-align:center}
.stat b{display:block;font-size:24px;color:var(--g)}
.f2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.in{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;font-family:inherit;font-size:14px;margin-top:4px}
.btn{background:var(--g);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-family:inherit;font-weight:700;cursor:pointer}
.sm{background:var(--gl);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:7px 12px;font-family:inherit;font-weight:600;cursor:pointer}
.tb{overflow-x:auto;margin-top:10px}
table{width:100%;border-collapse:collapse;min-width:800px;font-size:13px}
th,td{border-bottom:1px solid var(--bd);padding:8px 6px;text-align:right}
.login{max-width:380px;margin:80px auto;text-align:center}
.thumb{width:48px;height:48px;border-radius:10px;object-fit:cover;background:var(--gl);border:1px solid var(--bd)}
.plus{width:44px;height:44px;border-radius:50%;border:2px dashed var(--g);background:var(--gl);color:var(--g);font-size:26px;font-weight:800;cursor:pointer;line-height:1;font-family:inherit;flex:0 0 auto}
.plus:hover{background:#c8e6c9}
.bnr{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border:1px solid var(--bd);border-radius:14px;padding:10px;margin-top:10px}
.bnr img{width:220px;max-width:100%;aspect-ratio:16/6.5;object-fit:cover;border-radius:10px;background:var(--gl)}
.wc{display:inline-flex;align-items:center;gap:2px;background:var(--gl);border:1px solid var(--bd);border-radius:8px;padding:2px 4px 2px 8px;font-size:12px;font-weight:700;white-space:nowrap}
.wc .x{border:0;background:none;color:#c62828;cursor:pointer;font-size:12px;padding:0 3px;font-family:inherit}
.toast{position:fixed;bottom:16px;left:16px;background:#1b5e20;color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;display:none}
</style>
</head>
<body>
<div id="loginBox" class="box login">
  <h2>🔐 دخول إدارة المتجر</h2>
  <p style="color:var(--mu);font-size:13px">أدخل كلمة مرور المالك للوصول إلى لوحة التحكم</p>
  <input class="in" type="password" id="passInput" placeholder="كلمة المرور" autocomplete="current-password">
  <button class="btn" style="width:100%;margin-top:12px" id="loginBtn">دخول</button>
  <p id="loginErr" style="color:#c62828;font-size:13px"></p>
</div>
<script>try{ if('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister()})}); if(window.caches) caches.keys().then(function(ks){ks.forEach(function(k){caches.delete(k)})}); }catch(e){}</script>
